name: Refresh FEMA data and publish

on:
  push:            # every branch is tested; only main is published
  schedule:
    - cron: "17 5 * * 1"   # every Monday, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install pytest dbt-core==1.12.7 dbt-duckdb==1.11.1

      - name: Unit tests (Python pipeline + JavaScript KPI maths)
        run: |
          pytest -q tests
          node --test tests/*.test.js

      - name: Download FEMA data, build the dashboard file, save raw data for dbt
        run: python scripts/build_data.py --raw-dir dbt/raw

      - name: dbt build (SQL models + data tests, incl. dashboard reconciliation)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
        run: |
          dbt build
          dbt docs generate --static
          mkdir -p ../site/dbt
          cp target/static_index.html ../site/dbt/index.html

      - name: Save refreshed data to the repo
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/disasters.json
          if git diff --cached --quiet; then
            echo "Data unchanged."
          else
            git commit -m "Refresh FEMA data"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
